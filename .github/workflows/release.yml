name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            artifact: htcheck-linux-amd64
          - target: aarch64-macos
            os: macos-latest
            artifact: htcheck-darwin-arm64
          - target: x86_64-windows
            os: ubuntu-latest
            artifact: htcheck-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.target != 'x86_64-windows'
        run: |
          cd zig-out/bin
          tar czf ../../${{ matrix.artifact }}.tar.gz htcheck
          cd ../..
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.target == 'x86_64-windows'
        run: |
          cd zig-out/bin
          zip ../../${{ matrix.artifact }}.zip htcheck.exe
          cd ../..
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            htcheck-linux-amd64.tar.gz
            htcheck-linux-amd64.tar.gz.sha256
            htcheck-darwin-arm64.tar.gz
            htcheck-darwin-arm64.tar.gz.sha256
            htcheck-windows-amd64.zip
            htcheck-windows-amd64.zip.sha256
